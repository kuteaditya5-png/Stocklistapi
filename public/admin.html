<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Private responses · Gotham</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script src="/admin.js" defer></script></head><body><div class="shell"><header class="topbar"><span class="brand">A date in <b>Gotham.</b></span><span class="private">🔒 Private responses</span></header><main class="admin"><section class="admin-card admin-login" id="login"><p class="kicker">FOR YOUR EYES ONLY</p><h1>Your little <em>secret.</em></h1><form id="login-form"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary full" id="login-button">Sign in</button></form></section><p class="error" id="error" role="alert" hidden></p><div id="dashboard" hidden><div class="section-top"><h1>Did they say <em>yes?</em></h1><button class="secondary" id="logout">Sign out</button></div><section class="admin-card"><h2>Your invitation</h2><p>Recipient: <strong id="name"></strong></p><p class="small muted">Change the name in config/site.js, then commit and push.</p><label for="link">Copy this complete link to send</label><input id="link" readonly><div class="row"><button class="secondary" id="copy">Copy link</button><a class="secondary" id="preview">Preview invitation</a></div><p class="small" id="notice" role="status"></p></section><section class="admin-card"><div class="section-top"><h2>Selected date &amp; time</h2><button class="secondary" id="refresh">Refresh</button></div><div id="responses"></div></section></div></main><footer>Responses are stored privately in PostgreSQL.</footer></div></body></html>
